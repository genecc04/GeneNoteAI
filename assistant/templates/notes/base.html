{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>GeneNoteAI</title>
    <link rel="stylesheet" href="{% static 'notes/styles.css' %}">
</head>
<body>
    <div class="sidebar">
        <a href="{% url 'note_create' %}" class="new-note-btn">+ New note</a>
        {% for note in sidebar_notes %}
            <a href="{% url 'note_detail' note.id %}" class="note-item {% if note.id == active_note_id %}active{% endif %}" data-note-link>
                <span>{{ note.title }}</span>
                <span class="note-icons">☆ ✕</span>
            </a>
        {% endfor %}
    </div>
    <div class="main-panel" id="main-panel">
        {% block content %}{% endblock %}
    </div>

    <div class="modal-overlay" id="note-modal-overlay">
        <div class="modal-box">
            <span class="modal-close" id="note-modal-close">✕</span>
            <div id="note-modal-body">
                </div>
        </div>
    </div>

    <script>
        const modalOverlay = document.getElementById('note-modal-overlay');
        const modalBody = document.getElementById('note-modal-body');
        const modalClose = document.getElementById('note-modal-close');

        document.querySelector('.new-note-btn').addEventListener('click', function(e) {
            e.preventDefault();
            fetch(this.getAttribute('href'), {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(response => response.text())
            .then(html => {
                modalBody.innerHTML = html;
                modalOverlay.classList.add('open');
            });
        });

        modalClose.addEventListener('click', function() {
            modalOverlay.classList.remove('open');
        });

        document.getElementById('main-panel').addEventListener('submit', function(e) {
            const form = e.target;
            if (form.hasAttribute('data-quiz-form')) {
                e.preventDefault();

                const formData = new FormData(form);

                fetch(form.action, {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    body: formData
                })
                .then(response => response.text())
                .then(html => {
                    document.getElementById('main-panel').innerHTML = html;
                });
            }
        });

        document.querySelectorAll('[data-note-link]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('href');

                fetch(url, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                })
                .then(response => response.text())
                .then(html => {
                    document.getElementById('main-panel').innerHTML = html;

                    document.querySelectorAll('.note-item').forEach(item => item.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
