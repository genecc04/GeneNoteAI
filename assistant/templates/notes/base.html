{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>GeneNoteAI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <link rel="stylesheet" href="{% static 'notes/styles.css' %}">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-tabs">
            <button type="button" class="sidebar-tab {% if active_tab != 'chats' %}active{% endif %}" data-tab="notes">Notes</button>
            <button type="button" class="sidebar-tab {% if active_tab == 'chats' %}active{% endif %}" data-tab="chats">Chats</button>
        </div>
        <br>
        <div class="tab-panel" id="tab-notes" {% if active_tab == 'chats' %}style="display:none"{% endif %}>
            <a href="{% url 'note_create' %}" class="new-note-btn">+ New note</a>
            <div id="sidebar-list">
                {% include "notes/partials/sidebar_notes.html" %}
            </div>
        </div>

        <div class="tab-panel" id="tab-chats" {% if active_tab != 'chats' %}style="display:none"{% endif %}>
            <a href="{% url 'chat_new' %}" class="new-chat-btn">+ New chat</a>
            <div id="sidebar-chats-list">
                {% include "notes/partials/sidebar_chats.html" %}
            </div>
        </div>
    </div>
    <div class="main-panel" id="main-panel">
        {% block content %}{% endblock %}
    </div>

    <div class="modal-overlay" id="note-modal-overlay">
        <div class="modal-box">
            <span class="modal-close" id="note-modal-close">✕</span>
            <div id="note-modal-body">
                </div>
        </div>
    </div>

    <script>
        window.currentActiveNoteId = "{{ active_note_id|default:'' }}";
        window.currentActiveChatId = "{{ active_chat_id|default:'' }}";
    </script>
    <script src="{% static 'notes/app.js' %}"></script>
</body>
</html>
