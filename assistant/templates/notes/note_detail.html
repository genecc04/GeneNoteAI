<h1>{{ note.title }}</h1>

{% if note.file %}
    <p>Attached file: <a href="{{ note.file.url }}">{{ note.file.name }}</a></p>
{% endif %}

<h3>Content</h3>
<p>{{ note.content }}</p>

<h3>Summary</h3>
<p>{{ note.summary|default:"No summary yet." }}</p>

<a href="{% url 'generate_quiz' note.id %}">Generate Quiz from this Note</a>
