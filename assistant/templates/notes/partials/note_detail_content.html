<h1>{{ note.title }}</h1>

{% if note.file %}
    <p>Attached file: <a href="{{ note.file.url }}">{{ note.file.name }}</a></p>
{% endif %}

<h3>Content</h3>
<p>{{ note.content }}</p>

<h3>Summary</h3>
{% if summary_html %}
    {{ summary_html|safe }}
{% else %}
    <p>No summary yet.</p>
{% endif %}

<a href="{% url 'generate_quiz' note.id %}" data-note-link>Generate Quiz from this Note</a>
<a href="{% url 'generate_flashcards' note.id %}" data-note-link>Generate Flashcards from this Note</a>
