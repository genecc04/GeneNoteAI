<h2>Settings for this note</h2>
<p class="settings-intro">Anything left on default follows the global settings.</p>

<form method="post" action="{% url 'note_settings' note.id %}" id="note-settings-form">
    {% csrf_token %}
    {% for field in form %}
        {% include "notes/partials/settings_field.html" %}
    {% endfor %}
    <button type="submit">Save</button>
</form>
