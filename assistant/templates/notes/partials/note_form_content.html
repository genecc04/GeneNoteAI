<h1>Add a Note</h1>

<form method="post" enctype="multipart/form-data" action="{% url 'note_create' %}" onsubmit="this.querySelector('button').textContent='Saving & summarizing...'; this.querySelector('button').disabled=true;">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Note title" required><br>
    <textarea name="content" placeholder="Paste or write notes. Markdown and $math$ supported"></textarea><br>
    <input type="file" name="file"><br><br>
    <button type="submit">Save Note</button>
</form>
