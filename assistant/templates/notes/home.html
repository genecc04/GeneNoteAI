{% extends "notes/base.html" %}
{% block content %}
<h1>No notes yet</h1>
<p>Create your first note to get started.</p>

<h2>Your Chats</h2>
<a href="{% url 'chat_new' %}">+ New Chat</a>
<ul>
    {% for session in sessions %}
        <li><a href="{% url 'chat_session' session.id %}">{{ session.title }}</a></li>
    {% empty %}
        <li>No chats yet.</li>
    {% endfor %}
</ul>
{% endblock %}
